<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Posts de lancement Dzign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--noir:#0B0B0F;--graphite:#15151B;--ligne:#2A2A33;--ivoire:#F5F3EE;--gris:#A9A6A0;--or:#C8A96A;--or-clair:#E9D6A6;--emeraude:#0E7C5A;--vert:#7FD1AE;
--ft:"Syne",sans-serif;--fb:"Hanken Grotesk",sans-serif}
html[lang=ar]{--ft:"Readex Pro","IBM Plex Sans Arabic",sans-serif;--fb:"IBM Plex Sans Arabic",sans-serif}
html[lang=ar] *{letter-spacing:0!important}
*{box-sizing:border-box;margin:0}
body{background:#222;display:flex;flex-wrap:wrap;gap:40px;padding:40px;font-family:var(--fb);color:var(--ivoire)}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 0%,rgba(200,169,106,.14),transparent 55%),var(--noir);display:grid;grid-template-rows:auto 1fr auto;padding:84px 84px 72px}
.post::before{content:"";position:absolute;inset:36px;border:1px solid rgba(200,169,106,.22);pointer-events:none;border-radius:6px}
.haut{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.logo{font-family:"Syne",sans-serif;font-weight:800;font-size:44px;letter-spacing:-.02em;direction:ltr}
.logo b{color:var(--or)}
.logo small{font-family:"Hanken Grotesk",sans-serif;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--gris);font-weight:500;margin-left:10px}
.num{font-family:"Syne",sans-serif;font-size:22px;color:var(--gris);letter-spacing:.1em;direction:ltr}
.bas{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;font-size:24px;color:var(--gris)}
.bas b{color:var(--or);font-weight:600;direction:ltr;unicode-bidi:isolate}
.contenu{position:relative;z-index:2;display:grid;align-content:center;gap:34px}
.eyebrow{font-size:24px;letter-spacing:.24em;text-transform:uppercase;color:var(--or)}
h1{font-family:var(--ft);font-weight:700;font-size:104px;line-height:1.02;letter-spacing:-.035em}
html[lang=ar] h1{line-height:1.3;font-size:96px}
h1 em{font-style:normal;color:var(--or)}
.sous{font-size:36px;line-height:1.45;color:#D2CEC7;max-width:820px}
.fond{position:absolute;inset:0;z-index:0}
.fond img{width:100%;height:100%;object-fit:cover}
.fond::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--noir) 8%,rgba(11,11,15,.55) 45%,rgba(11,11,15,.2) 70%,rgba(11,11,15,.75) 100%)}
.pastille{display:inline-flex;align-items:center;gap:12px;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--vert);border:1.5px solid var(--emeraude);padding:10px 22px;border-radius:999px;width:max-content}
.pastille i{width:12px;height:12px;border-radius:50%;background:#3DDC97}
.geant{font-family:"Syne",sans-serif;font-weight:800;font-size:236px;line-height:.9;letter-spacing:-.05em;background:linear-gradient(100deg,#B89550,#F3E2B5 45%,#C8A96A 60%,#8E6E36);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.places{display:flex;gap:16px;align-items:center;font-size:30px;color:var(--gris)}
.places i{width:30px;height:30px;border-radius:50%;border:2px solid var(--or)}
.ecrans{position:relative;height:560px}
.ordi{position:absolute;left:0;top:30px;width:800px;border-radius:14px;overflow:hidden;border:2px solid var(--ligne);background:#1C1C23;box-shadow:0 40px 80px -30px #000}
.ordi .barre{height:40px;display:flex;align-items:center;gap:9px;padding:0 16px}
.ordi .barre i{width:12px;height:12px;border-radius:50%;background:#3A3A44}
.ordi img{display:block;width:100%;height:440px;object-fit:cover;object-position:top}
.tel{position:absolute;right:0;bottom:0;width:250px;height:520px;border-radius:38px;border:10px solid #111;overflow:hidden;background:#111;box-shadow:0 30px 60px -20px #000,0 0 0 2px var(--ligne)}
.tel img{width:100%;height:100%;object-fit:cover;object-position:top}
html[lang=ar] .ordi{left:auto;right:0}html[lang=ar] .tel{right:auto;left:0}
.champ{display:flex;align-items:center;gap:18px;border:2px solid var(--or);border-radius:14px;padding:26px 30px;font-size:40px;background:var(--graphite)}
.champ .curseur{width:3px;height:46px;background:var(--or)}
.fleche{font-size:60px;color:var(--or);text-align:center}
.teintes{display:flex;gap:22px}
.teintes i{width:70px;height:70px;border-radius:50%;box-shadow:inset 0 0 0 5px var(--noir),0 0 0 2px rgba(255,255,255,.25)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.bloc50{border:2px solid var(--ligne);border-radius:16px;padding:36px;display:grid;gap:14px;background:var(--graphite)}
.bloc50.or{border-color:var(--or);background:linear-gradient(180deg,rgba(200,169,106,.14),var(--graphite))}
.bloc50 b{font-family:"Syne",sans-serif;font-size:96px;color:var(--or);line-height:1;direction:ltr;text-align:start}
.bloc50 span{font-size:30px;color:#D2CEC7;line-height:1.35}
.liste{display:grid;gap:0;border-top:2px solid var(--ligne)}
.liste div{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:24px 0;border-bottom:2px solid var(--ligne);font-size:34px}
.liste div b{font-family:"Syne",sans-serif;font-size:42px}
.liste div span{color:var(--or);font-weight:600;font-variant-numeric:tabular-nums}
.liste div span bdi{direction:ltr}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--ligne);border-radius:16px;overflow:hidden}
.vs div{padding:22px 26px;font-size:28px;border-bottom:2px solid var(--ligne);line-height:1.3}
.vs .t{font-family:var(--ft);font-weight:700;font-size:32px}
.vs div:nth-child(odd){color:var(--gris)}
.vs div:nth-child(even){background:rgba(200,169,106,.08);color:var(--ivoire)}
.vs div:nth-child(even).t{color:var(--or)}
.vs div:nth-last-child(-n+2){border-bottom:0}
.cta{display:inline-flex;align-items:center;gap:16px;background:var(--or);color:var(--noir);font-weight:700;font-size:36px;padding:26px 44px;border-radius:999px;width:max-content}
.wa{display:inline-flex;align-items:center;gap:14px;font-size:34px;color:var(--ivoire)}
.wa svg{width:44px;height:44px;fill:#25D366}
.wa bdi{direction:ltr}
</style>
</head>
<body>
<div id="posts"></div>
<script>
var L=(location.hash==='#ar')?'ar':'fr';document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
var S='../site-dzign/medias/',C='medias/';
function T(fr,ar){return L==='ar'?ar:fr}
var WA='<span class="wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.2Z"/></svg><bdi>0794 70 93 23</bdi></span>';
var P=[
 function(){return '<div class="fond"><img src="'+C+'z-vertical.jpg" style="object-position:50% 30%"></div><div class="contenu" style="align-content:end;padding-bottom:20px"><p class="eyebrow">'+T('Nouveau · Alger','جديد · الجزائر العاصمة')+'</p><h1>'+T('Dzign Studio<br>est <em>ouvert.</em>','Dzign Studio<br><em>يفتح أبوابه.</em>')+'</h1><p class="sous">'+T('Sites web, expériences 3D, boutiques en ligne et applications. Au niveau des plus grandes marques.','مواقع إلكترونية، تجارب 3D، متاجر وتطبيقات. بمستوى كبرى العلامات العالمية.')+'</p></div>'},
 function(){return '<div class="contenu"><p class="eyebrow">'+T('Programme Fondateurs','برنامج المؤسسين')+'</p><div class="geant">-20%</div><h1 style="font-size:72px">'+T('sur toutes nos formules.','على جميع باقاتنا.')+'</h1><div class="places"><i></i><i></i><i></i><i></i><i></i><span>'+T('5 places seulement','5 أماكن فقط')+'</span></div><p class="sous" style="font-size:30px">'+T('En échange : votre avis et le droit de montrer votre site.','مقابل: رأيك والسماح لنا بعرض موقعك.')+'</p></div>'},
 function(){return '<div class="contenu"><span class="pastille"><i></i>'+T('Réalisation · En ligne','إنجاز حقيقي · متاح على الإنترنت')+'</span><div class="ecrans"><div class="ordi"><div class="barre"><i></i><i></i><i></i></div><img src="'+S+'lmdp-page.jpg"></div><div class="tel"><img src="'+S+'lmdp-mobile.jpg"></div></div><h1 style="font-size:84px">La Maison du Parquet</h1><p class="sous" style="font-size:32px">'+T('Comparateur avant / après, calculateur de cartons, réservation au showroom.','مقارنة قبل / بعد، حاسبة الكراتين، حجز زيارة صالة العرض.')+'</p></div>'},
 function(){return '<div class="contenu"><p class="eyebrow">'+T('Essai instantané','معاينة فورية')+'</p><h1>'+T('Votre site,<br><em>en 10 secondes.</em>','موقعك،<br><em>في 10 ثوانٍ.</em>')+'</h1><div class="champ">'+T('Pâtisserie Yasmine','حلويات ياسمين')+'<span class="curseur"></span></div><div class="fleche">↓</div><p class="sous">'+T('Tapez le nom de votre entreprise sur notre site : votre site apparaît, à votre nom, sur votre propre domaine.','اكتب اسم مؤسستك على موقعنا: يظهر موقعك فوراً، باسمك وعلى نطاقك الخاص.')+'</p></div>'},
 function(){return '<div class="fond"><img src="'+S+'fauteuil.jpg" style="object-position:50% 40%"></div><div class="contenu" style="align-content:end"><p class="eyebrow">'+T('Expérience 3D','تجربة 3D')+'</p><h1 style="color:#fff">'+T('Ils le font tourner.<br><em>Puis ils achètent.</em>','يديرونه بأيديهم.<br><em>ثم يشترون.</em>')+'</h1><div class="teintes"><i style="background:#EDE7DC"></i><i style="background:#C9714B"></i><i style="background:#8FA58A"></i><i style="background:#3D4F7A"></i><i style="background:#D3A63A"></i></div></div>'},
 function(){return '<div class="contenu"><p class="eyebrow">'+T('Paiement 100 % à distance','دفع عن بُعد 100%')+'</p><h1 style="font-size:88px">'+T('Vous voyez votre site <em>avant</em> de payer le solde.','ترى موقعك <em>قبل</em> دفع الباقي.')+'</h1><div class="split"><div class="bloc50"><b>50%</b><span>'+T('au lancement, par BaridiMob','عند الانطلاق، عبر BaridiMob')+'</span></div><div class="bloc50 or"><b>50%</b><span>'+T('après avoir vu votre site terminé','بعد رؤية موقعك جاهزاً')+'</span></div></div></div>'},
 function(){var o=[['Impact','30 000'],['Signature','80 000'],['Commerce','150 000'],['Immersion','250 000'],['Plateforme','400 000']];return '<div class="contenu"><p class="eyebrow">'+T('Nos formules','باقاتنا')+'</p><h1 style="font-size:80px">'+T('Choisissez votre <em>niveau d\'ambition.</em>','اختر <em>مستوى طموحك.</em>')+'</h1><div class="liste">'+o.map(function(x){return '<div><b>'+x[0]+'</b><span>'+T('dès ','ابتداءً من ')+'<bdi>'+x[1]+'</bdi>'+T(' DA',' دج')+'</span></div>'}).join('')+'</div><p class="sous" style="font-size:28px">'+T('Nom de domaine et email pro inclus. Prix final fixé dans le devis.','اسم النطاق والبريد المهني مشمولان. السعر النهائي يُحدَّد في عرض السعر.')+'</p></div>'},
 function(){var r=T([['Un site ordinaire','Un site Dzign'],['Un modèle déjà vu','Création sur mesure + 3D'],['Payé d\'avance','50 % après avoir vu le site'],['Une seule langue','Arabe, français, anglais'],['Livré, et c\'est tout','Pubs et clients en plus']],[['موقع عادي','موقع Dzign'],['قالب سبق رؤيته','تصميم حسب الطلب + 3D'],['يُدفع مسبقاً','50% بعد رؤية الموقع'],['لغة واحدة','العربية والفرنسية والإنجليزية'],['يُسلَّم وانتهى','إعلانات وزبائن إضافيون']]);return '<div class="contenu"><p class="eyebrow">'+T('Pourquoi Dzign','لماذا Dzign')+'</p><h1 style="font-size:84px">'+T('La différence <em>se voit.</em>','الفرق <em>واضح.</em>')+'</h1><div class="vs">'+r.map(function(x,i){return '<div class="'+(i?'':'t')+'">'+x[0]+'</div><div class="'+(i?'':'t')+'">'+(i?'✓ ':'')+x[1]+'</div>'}).join('')+'</div></div>'},
 function(){return '<div class="fond"><img src="'+S+'z-or.jpg" style="object-position:72% 50%;transform:scale(1.12) translateY(-10%)"></div><div class="contenu" style="align-content:end"><h1>'+T('Prêt à <em>briller</em> en ligne ?','مستعد <em>للتألّق</em> على الإنترنت؟')+'</h1><p class="sous">'+T('Choisissez votre offre sur notre site, votre message WhatsApp est prêt.','اختر باقتك على موقعنا، ورسالتك على واتساب جاهزة.')+'</p><span class="cta">'+T('Lien en bio →','الرابط في البايو ←')+'</span>'+WA+'<span style="height:36px"></span></div>'}
];
document.getElementById('posts').innerHTML=P.map(function(f,i){return '<section class="post" id="p'+(i+1)+'"><div class="haut"><span class="logo">d<b>z</b>ign<small>studio</small></span><span class="num">0'+(i+1)+' / 09</span></div>'+f()+'<div class="bas"><span>'+T('Studio digital · Alger','استوديو رقمي · الجزائر')+'</span><b>@dzignstudio</b></div></section>'}).join('');
</script>
</body>
</html>
