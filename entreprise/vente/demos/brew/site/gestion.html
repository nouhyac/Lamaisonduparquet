<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BREW — Espace gérant</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2B201C">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>
  <!-- Connexion par code PIN -->
  <main class="login" id="login">
    <div class="login__card">
      <span class="login__logo" data-logo="badge"></span>
      <h1 class="login__title" data-i18n="gTitle">Espace gérant</h1>
      <p class="login__hint" data-i18n="gPinHint">Entrez votre code PIN</p>
      <div class="pin" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <label class="sr" for="pinInput" data-i18n="gPin">Code PIN</label>
      <input class="sr" id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
      <div class="pad" id="pad" role="group" aria-label="PIN">
        <button type="button">1</button><button type="button">2</button><button type="button">3</button>
        <button type="button">4</button><button type="button">5</button><button type="button">6</button>
        <button type="button">7</button><button type="button">8</button><button type="button">9</button>
        <button type="button" data-k="lang" class="pad__s"><span data-i18n="lang">العربية</span></button><button type="button">0</button><button type="button" data-k="del" class="pad__s" data-i18n-aria="gDel" aria-label="Effacer">⌫</button>
      </div>
      <p class="form-msg is-err" id="pinErr" role="alert"></p>
      <p class="login__demo" data-i18n="gDemoCodes">Démo : gérant 0328 · bar 1111 · cuisine brunch 1112 · caisse 2222</p>
      <a class="login__back" href="index.html" data-i18n="gBackSite">← Retour au site</a>
    </div>
  </main>

  <!-- Application -->
  <div class="app" id="app" hidden>
    <header class="bar">
      <span class="bar__mark" data-logo="mark"></span>
      <div class="bar__who"><strong id="roleName">Gérant</strong><small id="clock"></small></div>
      <div class="bar__acts">
        <button type="button" class="btn-lang" id="langBtn" data-i18n-aria="langLabel" aria-label="Afficher en arabe"><span data-i18n="lang">العربية</span></button>
        <a class="btn btn--s btn--line" href="index.html" target="_blank" rel="noopener" data-i18n="gSeeSite">Voir le site</a>
        <button type="button" class="btn btn--s" id="logout" data-i18n="gLogout">Déconnexion</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <dialog class="sheet" id="modal" aria-labelledby="modalTitle"><div class="sheet__in" id="modalIn"></div></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/gestion.js"></script>
</body>
</html>
