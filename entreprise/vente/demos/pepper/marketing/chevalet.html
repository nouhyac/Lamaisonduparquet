<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Federo&family=Josefin+Sans:wght@400;600;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<script src="logo.js"></script><script src="qr.js"></script>
<style>
@page{size:105mm 148mm;margin:0}
*{box-sizing:border-box}html,body{margin:0}
.pg{width:105mm;height:148mm;background:#C9B198;position:relative;overflow:hidden;font-family:'Josefin Sans',sans-serif;color:#1B1714;display:flex;flex-direction:column;align-items:center;padding:9mm 8mm 7mm;text-align:center}
.pg:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 40%,rgba(255,250,240,.45),transparent 70%)}
.pg>*{position:relative}
.lg{width:62mm}
h1{font-size:7.4mm;line-height:1.05;text-transform:uppercase;letter-spacing:.05em;margin:5mm 0 0;font-weight:700}
h1 em{font-style:normal;color:#B3140C}
.qrc{background:#FFFDF8;border-radius:4mm;padding:4mm;margin:5mm 0 4mm;box-shadow:0 2mm 5mm -2mm rgba(27,23,20,.4)}
.qrc svg{width:40mm;height:40mm;display:block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;width:100%;font-size:3.1mm;line-height:1.2;font-weight:600}
.steps b{display:block;font-family:Federo;font-size:7mm;color:#B3140C;font-weight:400;line-height:1}
.ar{font-family:Cairo,sans-serif;direction:rtl;font-size:3.6mm;font-weight:800;margin-top:3.5mm}
.ft{margin-top:auto;font-size:2.7mm;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase;font-weight:700;border-top:.3mm solid rgba(27,23,20,.4);padding-top:2.5mm;width:100%}
</style></head><body>
<div class="pg">
  <div class="lg" id="lg"></div>
  <h1>Commande d'ici.<br><em>Sans faire la queue.</em></h1>
  <div class="qrc" id="qr"></div>
  <div class="steps"><div><b>1</b>Scanne<br>et choisis</div><div><b>2</b>Reçois<br>ton numéro</div><div><b>3</b>Récupère<br>quand c'est prêt</div></div>
  <div class="ar">اطلب من هنا بدون طابور · امسح الرمز</div>
  <div class="ft">Paiement au comptoir · Garden City · 3e étage</div>
</div>
<script>
document.getElementById('lg').innerHTML = PEPPER_LOGO({ shadow: 'rgba(27,23,20,.25)' });
document.getElementById('qr').innerHTML = QR.svg(location.hash.slice(1) || 'https://claude.ai/artifact/88bsfx1xfmgvsDxjXXrH84', { color: '#1B1714', label: 'Commander en ligne' });
</script></body></html>
