<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commandes · Kit alarme AirShield</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body{background:var(--bg)}
.gate{min-height:100vh;display:grid;place-items:center;background:var(--night);color:#fff;padding:20px}
.gate form{display:grid;gap:12px;width:min(320px,100%);text-align:center}
.gate input{text-align:center;font-size:24px;letter-spacing:.4em}
.adm{padding-block:30px 60px}
.adm h1{font-size:36px;margin:6px 0 4px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--muted);font-weight:700}.kpi b{display:block;font-family:var(--disp);font-size:30px}
@media (max-width:700px){.kpi{grid-template-columns:1fr 1fr}}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:760px}
th,td{padding:12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select.s{padding:7px 10px;width:auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:end}
.empty{padding:30px;text-align:center;color:var(--muted)}
a.wa{color:#16A34A;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="gate" id="gate"><form id="gf"><div class="brand" style="justify-content:center"><span class="b-air">Air</span><span class="b-shield">Shield</span></div><h2 style="font-size:26px">Espace commandes</h2><input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Code"><button class="btn btn-red">Entrer</button><small style="color:#8C95AD">Démo : code 0328</small><div class="err" id="ge"></div></form></div>
<main class="wrap adm" id="app" hidden>
  <div class="bar"><div><span class="eyebrow dark-t">Kit alarme Dahua AirShield</span><h1>Commandes reçues</h1></div><div class="row"><button class="btn btn-ghost" style="color:var(--ink);border-color:var(--ink)" id="csv">Exporter (Excel / CSV)</button><a class="btn btn-red" href="index.html">Voir la page</a></div></div>
  <div class="kpi" id="kpi"></div>
  <div class="tw"><table><thead><tr><th>Date</th><th>Client</th><th>Téléphone</th><th>Livraison</th><th>Qté</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="js/config.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const get = () => { try { return JSON.parse(localStorage.getItem('ads-orders') || '[]'); } catch (e) { return []; } };
  const put = l => { try { localStorage.setItem('ads-orders', JSON.stringify(l)); } catch (e) { /* bloqué */ } };
  const ST = ['nouvelle', 'confirmée', 'expédiée', 'livrée', 'annulée'];
  function open() { $('#gate').hidden = true; $('#app').hidden = false; render(); try { sessionStorage.setItem('ads-ok', '1'); } catch (e) { /* bloqué */ } }
  $('#gf').onsubmit = e => { e.preventDefault(); if ($('#pin').value === window.SHOP.pin) open(); else $('#ge').textContent = 'Code incorrect'; };
  try { if (sessionStorage.getItem('ads-ok')) open(); } catch (e) { /* bloqué */ }
  function render() {
    const l = get(), today = new Date().toDateString();
    const n = s => l.filter(o => o.status === s).length;
    $('#kpi').innerHTML = [['Aujourd\'hui', l.filter(o => new Date(o.at).toDateString() === today).length], ['À confirmer', n('nouvelle')], ['Confirmées', n('confirmée') + n('expédiée')], ['Livrées', n('livrée')]].map(k => '<div><small>' + k[0] + '</small><b>' + k[1] + '</b></div>').join('');
    $('#rows').innerHTML = l.length ? l.map((o, i) => '<tr><td>' + new Date(o.at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</td><td><b>' + esc(o.name) + '</b></td><td>' + esc(o.phone) + '<br><a class="wa" target="_blank" rel="noopener" href="https://wa.me/213' + esc(o.phone.slice(1)) + '">WhatsApp →</a></td><td>' + esc(o.wil) + ' · ' + esc(o.com) + (o.adr ? '<br><small>' + esc(o.adr) + '</small>' : '') + '</td><td>' + o.qty + '</td><td><select class="s" data-i="' + i + '">' + ST.map(s => '<option' + (s === o.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></td></tr>').join('') : '<tr><td colspan="6" class="empty">Aucune commande pour l\'instant. Passez une commande test depuis la page.</td></tr>';
  }
  document.addEventListener('change', e => { const s = e.target.closest('[data-i]'); if (!s) return; const l = get(); l[+s.dataset.i].status = s.value; put(l); render(); });
  $('#csv').onclick = () => {
    const l = get(); const rows = [['Date', 'Nom', 'Téléphone', 'Wilaya', 'Commune', 'Adresse', 'Quantité', 'Statut']].concat(l.map(o => [new Date(o.at).toLocaleString('fr-FR'), o.name, o.phone, o.wil, o.com, o.adr, o.qty, o.status]));
    const csv = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\n');
    const ta = document.createElement('textarea'); ta.value = csv; document.body.appendChild(ta); ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(csv) : Promise.reject()).then(() => alertMsg('Tableau copié : collez-le dans Excel.')).catch(() => { try { document.execCommand('copy'); alertMsg('Tableau copié : collez-le dans Excel.'); } catch (x) { alertMsg('Sélectionnez et copiez le tableau.'); } });
    ta.remove();
  };
  function alertMsg(m) { const b = $('#csv'); const o = b.textContent; b.textContent = m; setTimeout(() => b.textContent = o, 2500); }
  addEventListener('storage', render);
})();
</script>
</body>
</html>
