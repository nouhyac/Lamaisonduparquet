<title>Pilotage Instagram EGGER</title>
<meta name="description" content="Tableau de bord Instagram de La Maison du Parquet (représentant EGGER en Algérie) : performance, schémas gagnants et plan d'action à partir des données Windsor.ai.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout : en-tête co-marqué fixe · barre de pilotage (période, comparaison, objectif, filtres) · onglets · une section par onglet */
:root{
 --bg:#ffffff;--paper:#f5f5f4;--ink:#2e2e2e;--mut:#6b6b69;--faint:#9a9a97;--line:#e2e2df;--chip:#efefed;
 --red:#e2001a;--red-h:#b90015;--red-soft:#fde7ea;
 --data:#3a3a38;--data-2:#9b9b97;--data-soft:#d9d9d5;--grid:#ececea;
 --good:#1d7f4e;--good-soft:#e3f2ea;--warn:#9a5b00;--warn-soft:#fbf0dc;--bad:#b3261e;--bad-soft:#fae6e4;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
 --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Fira Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--paper:#1f1f1e;--ink:#ededeb;--mut:#a8a8a4;--faint:#7c7c78;--line:#343432;--chip:#292928;--red:#ff4d5e;--red-h:#ff6b79;--red-soft:#3a1d21;--data:#dcdcd8;--data-2:#8d8d89;--data-soft:#454543;--grid:#2a2a29;--good:#46b884;--good-soft:#17302a;--warn:#e3a647;--warn-soft:#352a17;--bad:#ff7a70;--bad-soft:#3b1f1d;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--paper:#1f1f1e;--ink:#ededeb;--mut:#a8a8a4;--faint:#7c7c78;--line:#343432;--chip:#292928;--red:#ff4d5e;--red-h:#ff6b79;--red-soft:#3a1d21;--data:#dcdcd8;--data-2:#8d8d89;--data-soft:#454543;--grid:#2a2a29;--good:#46b884;--good-soft:#17302a;--warn:#e3a647;--warn-soft:#352a17;--bad:#ff7a70;--bad-soft:#3b1f1d;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{font-weight:500;letter-spacing:-.012em;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(1.5rem,2.6vw,2rem)}
h3{font-size:1.12rem}
h4{font-size:.98rem}
p{margin:0;text-wrap:pretty}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.lab{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--red);margin:0 0 8px}
.mut{color:var(--mut)}
.small{font-size:.84rem}
.xs{font-size:.76rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.brand .lm{height:38px;width:auto}.brand .eg{height:19px;width:auto;margin-top:4px}
.brand .sep{width:1px;height:28px;background:var(--line)}
.lm-w,.eg-w{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lm-b,:root:not([data-theme="light"]) .eg-b{display:none}:root:not([data-theme="light"]) .lm-w,:root:not([data-theme="light"]) .eg-w{display:block}}
:root[data-theme="dark"] .lm-b,:root[data-theme="dark"] .eg-b{display:none}:root[data-theme="dark"] .lm-w,:root[data-theme="dark"] .eg-w{display:block}
.top .ttl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.top .ttl b{font-weight:500;font-size:1rem;white-space:nowrap}
.top .ttl span{font-size:.76rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;border:1px solid var(--line);border-radius:3px;padding:6px 10px;background:transparent;cursor:pointer;white-space:nowrap}
.src i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.src.real i{background:var(--good)}
@media (max-width:760px){.top .ttl{display:none}.brand .lm{height:32px}.brand .eg{height:16px}}
@media (max-width:420px){.src span{display:none}}

/* control bar */
.ctrl{border-bottom:1px solid var(--line);background:var(--paper)}
.ctrl .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;padding-block:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.fld>.l{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:.84rem;cursor:pointer;border-inline-end:1px solid var(--line)}
.seg button:last-child{border:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=date],input[type=text],input[type=search]{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:7px 9px;font-size:.86rem;max-width:100%}
.custom{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:7px 12px;font-size:.86rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-h)}
.btn .cnt{background:var(--red);color:#fff;border-radius:9px;font-size:.7rem;padding:0 6px;line-height:1.5}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;padding-block:0 14px}
.filters .dis{opacity:.55}
.ctx{font-size:.8rem;color:var(--mut);padding-block:0 12px}

/* tabs */
.tabs{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:transparent;padding:13px 12px 11px;font-size:.88rem;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:500}

main{padding-block:28px 80px}
.sec-h{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.sec-h .lede{max-width:70ch;color:var(--mut);margin-top:8px}
.block{margin-top:36px}
.block>h3{margin-bottom:6px}
.block>.sub{color:var(--mut);font-size:.88rem;margin-bottom:16px;max-width:80ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}
.grid>*{min-width:0}
.panel{border:1px solid var(--line);border-radius:4px;padding:18px;background:var(--bg)}
.panel.soft{background:var(--paper)}
.panel h4{margin-bottom:8px}

/* provenance chips */
.pv{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border-radius:2px;padding:2px 6px;vertical-align:middle;white-space:nowrap;border:1px solid var(--line);color:var(--mut)}
.pv:before{content:"";width:6px;height:6px;border-radius:1px;background:currentColor}
.pv.ig{color:var(--s1)}.pv.calc{color:var(--data)}.pv.ded{color:var(--s2)}.pv.hyp{color:var(--warn)}.pv.reco{color:var(--red)}.pv.ex{color:var(--warn);border-color:var(--warn)}
.legend-pv{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--mut);align-items:center}

/* demo banner */
.demo{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--warn);background:var(--warn-soft);border-radius:4px;padding:12px 16px;margin-bottom:22px;font-size:.88rem}
.demo b{font-weight:600}
.demo .btn{margin-inline-start:auto}
@media (max-width:640px){.demo{flex-direction:column}.demo .btn{margin:0}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:.78rem;color:var(--mut);display:flex;justify-content:space-between;gap:6px;align-items:flex-start;line-height:1.3}
.kpi .k .pv{flex:none;padding:1px 5px;font-size:.6rem}
.kpi .v{font-size:1.55rem;font-weight:500;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .d{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--mut);font-variant-numeric:tabular-nums}
.kpi .na{font-size:.8rem;color:var(--faint);line-height:1.35}
.kpi svg{display:block;width:100%;height:28px;margin-top:2px}
.tr{display:inline-flex;align-items:center;gap:3px;font-weight:500;border-radius:2px;padding:0 5px}
.tr.up{color:var(--good);background:var(--good-soft)}.tr.dn{color:var(--bad);background:var(--bad-soft)}.tr.eq{color:var(--mut);background:var(--chip)}
.kgroup{margin-top:22px}
.kgroup>h4{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500;margin-bottom:8px}

/* summary writing */
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.sum3{grid-template-columns:1fr}}
.sum3 .panel h4{display:flex;align-items:center;gap:8px}
.sum3 ol{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:8px;font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.verdict{border-inline-start:3px solid var(--red);padding:14px 18px;background:var(--paper);border-radius:0 4px 4px 0;margin-top:14px}
.verdict p+p{margin-top:8px}

/* alerts */
.alerts{display:grid;gap:10px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border:1px solid var(--line);border-inline-start:3px solid var(--mut);border-radius:0 4px 4px 0;padding:12px 14px;font-size:.88rem}
.alert.bad{border-inline-start-color:var(--bad)}.alert.good{border-inline-start-color:var(--good)}.alert.warn{border-inline-start-color:var(--warn)}
.alert .ic{grid-row:span 2;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;min-width:70px}
.alert.bad .ic{color:var(--bad)}.alert.good .ic{color:var(--good)}.alert.warn .ic{color:var(--warn)}
.alert dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0}
.alert dt{color:var(--mut)}.alert dd{margin:0}

/* recommendations */
.rec{border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:8px;background:var(--bg)}
.rec .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rec h4{flex:1 1 240px}
.rec dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:0;font-size:.88rem}
.rec dt{color:var(--mut)}.rec dd{margin:0}
@media (max-width:520px){.rec dl{grid-template-columns:1fr}.rec dt{margin-top:4px}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:500;border-radius:2px;padding:2px 7px;white-space:nowrap;background:var(--chip);color:var(--ink)}
.pill.hi{background:var(--red-soft);color:var(--red)}
.pill.c-hi{background:var(--good-soft);color:var(--good)}.pill.c-md{background:var(--warn-soft);color:var(--warn)}.pill.c-lo{background:var(--chip);color:var(--mut)}
.grade{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:500;white-space:nowrap}
.grade i{width:28px;height:18px;border-radius:2px;display:inline-grid;place-items:center;font-style:normal;font-size:.72rem;font-variant-numeric:tabular-nums;color:#fff}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mut);font-size:.74rem;letter-spacing:.04em;background:var(--paper);white-space:nowrap;position:sticky;top:0}
th.n,td.n{text-align:end;white-space:nowrap}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
th.sorted{color:var(--ink)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--paper)}
td .cap{max-width:320px;min-width:200px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{width:40px;height:40px;border-radius:3px;display:grid;place-items:center;font-size:.62rem;font-weight:600;color:#fff;flex:none;letter-spacing:.04em}
.big-tbl{max-height:640px;overflow:auto}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--mut);font:11px var(--sans);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.cleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--mut);margin-bottom:8px}
.cleg span{display:inline-flex;align-items:center;gap:6px}
.cleg i{width:12px;height:3px;border-radius:2px;display:inline-block}
.cleg i.sq{height:10px;width:10px;border-radius:2px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,190px) 1fr auto;gap:10px;align-items:center;font-size:.84rem}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tk{height:14px;background:var(--grid);border-radius:0 3px 3px 0;position:relative}
.bar .fl{height:100%;background:var(--data-2);border-radius:0 4px 4px 0;min-width:2px}
.bar.hl .fl{background:var(--red)}
.bar.lo .fl{background:var(--data-soft)}
.bar .vl{font-variant-numeric:tabular-nums;text-align:end;min-width:72px;white-space:nowrap}
.bar .vl small{color:var(--faint);margin-inline-start:4px}
@media (max-width:520px){.bar{grid-template-columns:minmax(70px,110px) 1fr auto}}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;line-height:1.4;padding:7px 10px;border-radius:3px;max-width:280px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
.heat{display:grid;grid-template-columns:70px repeat(5,minmax(0,1fr));gap:3px;font-size:.78rem}
.heat .h{color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 2px;line-height:1.2}
.heat .h.r{justify-content:flex-start}
.heat .c{border-radius:3px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;cursor:default}
.heat .c b{font-weight:500;font-size:.9rem}
.heat .c small{font-size:.66rem;opacity:.8}
.heat .c.empty{background:repeating-linear-gradient(135deg,var(--paper) 0 5px,var(--bg) 5px 10px);color:var(--faint)}
.scale{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--mut);margin-top:10px}
.scale .g{height:8px;width:140px;border-radius:2px}
.funnel{display:grid;gap:6px}
.fstep{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:.86rem}
.fstep .fb{height:34px;background:var(--data-2);border-radius:0 4px 4px 0;display:flex;align-items:center;padding-inline:10px;color:var(--bg);font-variant-numeric:tabular-nums;font-weight:500;min-width:fit-content;white-space:nowrap}
.fstep .fb.leak{background:var(--red)}
.fconv{grid-column:2;font-size:.76rem;color:var(--mut);padding-inline-start:4px}
.fconv.leak{color:var(--red);font-weight:500}
@media (max-width:520px){.fstep{grid-template-columns:1fr}.fconv{grid-column:1}}

/* reel cards */
.reel{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.reel>header{display:flex;gap:14px;align-items:flex-start;padding:16px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.reel>header .thumb{width:54px;height:72px}
.reel>header .t{flex:1 1 260px;min-width:0}
.reel>header .t p{font-size:.92rem;margin-top:4px}
.reel .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reel .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:0}
.reel .body>div{padding:16px;min-width:0}
.reel .body>div+div{border-inline-start:1px solid var(--line)}
@media (max-width:900px){.reel .body{grid-template-columns:1fr}.reel .body>div+div{border-inline-start:0;border-top:1px solid var(--line)}}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.mgrid div{display:flex;flex-direction:column;font-size:.78rem;color:var(--mut)}
.mgrid b{font-size:1rem;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.mgrid .x{font-size:.72rem}
.mgrid .x.up{color:var(--good)}.mgrid .x.dn{color:var(--bad)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:.86rem;margin:0}
.kv dt{color:var(--mut)}.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}}
.reel h5{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:16px 0 8px}
.reel h5:first-child{margin-top:0}
.reel ul{margin:0;padding-inline-start:18px;display:grid;gap:5px;font-size:.88rem}
.toplists{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.toplists ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:r}
.toplists li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;font-size:.84rem;counter-increment:r;align-items:baseline}
.toplists li:before{content:counter(r);color:var(--faint);font-variant-numeric:tabular-nums}
.toplists li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.toplists li span .lnk{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplists li b{font-weight:500;font-variant-numeric:tabular-nums}
.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;text-align:start}
.lnk:hover{text-decoration-color:var(--red)}

/* hooks */
.hooks{display:grid;gap:8px;counter-reset:h}
.hook{display:grid;grid-template-columns:28px 1fr;gap:10px;border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-size:.9rem}
.hook:before{counter-increment:h;content:counter(h);color:var(--faint);font-variant-numeric:tabular-nums}
.hook code{font-family:var(--mono);font-size:.8rem;background:var(--chip);border-radius:2px;padding:0 4px}
.hook small{display:block;color:var(--mut);margin-top:4px;font-size:.78rem}

/* calendar */
.cal td{font-size:.8rem;min-width:120px}
.cal td:first-child{min-width:92px}

/* data tab */
.drop{border:1.5px dashed var(--line);border-radius:4px;padding:26px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop.over{border-color:var(--red);background:var(--red-soft)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:3px;background:var(--bg);padding:10px;font:12px/1.5 var(--mono)}
pre.code{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px;font:12px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.av-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px;font-size:.84rem}
.av-list div{display:flex;gap:8px;align-items:center}
.ok{color:var(--good)}.ko{color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:3px;font-size:.88rem;z-index:120;box-shadow:var(--shadow)}
.na-msg{color:var(--faint);font-size:.86rem;padding:10px 0}
.conf-note{font-size:.78rem;color:var(--mut);margin-top:6px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.idea{border:1px solid var(--line);border-radius:4px;padding:14px;display:grid;gap:6px;font-size:.86rem;align-content:start}
.idea h4{font-size:.94rem}
.idea .kv{grid-template-columns:90px 1fr;font-size:.82rem}
.opp td{font-size:.82rem}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:10px;border-radius:1px;background:var(--data-soft)}
.meter i.on{background:var(--data)}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:.8rem;color:var(--mut)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
